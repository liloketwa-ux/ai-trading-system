[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-system"
version = "0.0.1"
description = "AI-driven trading system: ingestion, NLP/sentiment, strategy generation, backtesting, and execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "ccxt>=4.0",
]

[project.optional-dependencies]
nlp = ["transformers>=4.40", "torch>=2.2"]
backtest = ["backtrader>=1.9"]
# scipy is test-only: it cross-validates the hand-rolled KS test.
# The library itself depends on numpy alone.
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
